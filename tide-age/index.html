input{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:10px 18px;width:100%;color:var(--text);outline:none;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}input::placeholder{color:var(--muted)}

.primary{background:var(--accent);color:var(--void);font-weight:700;padding:10px 24px}.primary:hover{background:#f29a55;color:var(--void)}
