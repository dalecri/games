<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubik's Cube - Vibe Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #FBF5F0; font-family: sans-serif; }
        canvas { display: block; }
        .no-select { user-select: none; -webkit-user-select: none; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
    </style>
</head>
<body class="text-[#25212A]">

    <!-- Header -->
    <div class="absolute top-8 left-8 pointer-events-none no-select z-10">
        <h1 class="text-5xl font-black italic tracking-tighter uppercase leading-[0.85]">
            Rubic's <br/> <span class="text-[#413C7B]">Cube.</span>
        </h1>
        <div class="mt-6 flex items-center gap-6">
            <div class="text-[10px] font-black uppercase tracking-[0.4em] flex flex-col text-[#413C7B]/60">
                <span>Moves</span>
                <span id="moveCount" class="text-xl text-[#25212A]">0</span>
            </div>
            <div id="activeKey" class="text-4xl font-black text-[#BF77F6] opacity-0 transition-opacity duration-200">
                -
            </div>
        </div>
    </div>

    <!-- Compact Hex Editor Panel - Bottom Left -->
    <div class="absolute bottom-8 left-8 bg-[#FBF5F0]/70 backdrop-blur-2xl p-3 rounded-2xl shadow-xl border border-[#DBD9E1] flex flex-col gap-2 z-20">
        <h2 class="text-[9px] font-black uppercase tracking-widest text-[#413C7B] text-center mb-1">Colors</h2>
        <div id="colorEditor" class="flex flex-col gap-2">
            <!-- JS will populate inputs here -->
        </div>
    </div>

    <!-- UI Controls Overlay -->
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex flex-col items-center gap-6 w-full max-w-md px-4 z-10">
        <div class="bg-[#FBF5F0]/40 backdrop-blur-xl p-2 rounded-[2rem] shadow-lg flex gap-2 border border-[#DBD9E1]">
            <template id="keyTemplate">
                <div class="key-display w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-2xl font-black text-lg transition-all duration-200 border-b-[4px] bg-[#FBF5F0] text-[#25212A] border-[#DBD9E1]"></div>
            </template>
            <div id="wasdDock" class="flex gap-2">
                <!-- A, W, S, D, Q, E buttons -->
            </div>
        </div>

        <button id="shuffleBtn" class="px-12 py-4 bg-[#25212A] text-[#FBF5F0] rounded-full font-black text-[10px] uppercase tracking-[0.4em] shadow-xl hover:shadow-2xl hover:bg-[#413C7B] active:scale-95 transition-all">
            Shuffle
        </button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- State & Constants ---
        let faceColors = ['#FBF5F0', '#DBD9E1', '#F56C73', '#BF77F6', '#413C7B', '#25212A'];
        const faceLabels = ['Right', 'Left', 'Top', 'Bottom', 'Front', 'Back'];
        const frameColor = '#25212A';
        const bgColor = '#FBF5F0';

        let moveCount = 0;
        let isAnimating = false;
        let isShuffling = false;

        const cubies = [];
        const materials = [];
        const cubeGroup = new THREE.Group();

        // --- DOM Elements ---
        const moveCountEl = document.getElementById('moveCount');
        const activeKeyEl = document.getElementById('activeKey');
        const colorEditor = document.getElementById('colorEditor');
        const wasdDock = document.getElementById('wasdDock');
        const shuffleBtn = document.getElementById('shuffleBtn');

        // --- Initialize UI ---
        function initUI() {
            // Build Color Inputs
            faceColors.forEach((color, idx) => {
                const row = document.createElement('div');
                row.className = "flex items-center gap-2";
                row.innerHTML = `
                    <div class="w-3 text-[9px] font-bold text-[#413C7B]/70 uppercase text-center">${faceLabels[idx][0]}</div>
                    <input type="color" value="${color}" data-idx="${idx}" class="color-picker w-5 h-5 rounded cursor-pointer border-0 p-0 bg-transparent">
                    <input type="text" value="${color.toUpperCase()}" data-idx="${idx}" class="hex-text w-14 bg-transparent border-b border-[#DBD9E1] px-1 py-0.5 text-[10px] font-mono text-[#413C7B] focus:outline-none focus:border-[#413C7B] uppercase" maxLength="7">
                `;
                colorEditor.appendChild(row);
            });

            // Build WASD Dock
            ['A', 'W', 'S', 'D', 'Q', 'E'].forEach(k => {
                const btn = document.createElement('div');
                btn.id = `key-${k}`;
                btn.className = "w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-2xl font-black text-lg transition-all duration-200 border-b-[4px] bg-[#FBF5F0] text-[#25212A] border-[#DBD9E1]";
                btn.innerText = k;
                wasdDock.appendChild(btn);
            });

            // Event Listeners for colors
            document.querySelectorAll('.color-picker, .hex-text').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = e.target.dataset.idx;
                    const val = e.target.value;
                    faceColors[idx] = val;
                    // Sync other input
                    const pair = e.target.classList.contains('color-picker') ? e.target.nextElementSibling : e.target.previousElementSibling;
                    pair.value = val;
                    updateTextures();
                });
            });

            shuffleBtn.addEventListener('click', shuffle);
        }

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(bgColor);

        const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(9, 9, 13);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.1;

        function createTextureCanvas(color) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = frameColor;
            ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = color;
            const p = 16, s = 256 - p*2;
            ctx.beginPath();
            ctx.roundRect(p, p, s, s, 14);
            ctx.fill();
            return canvas;
        }

        function updateTextures() {
            faceColors.forEach((color, idx) => {
                const material = materials[idx];
                const canvas = material.map.image;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = frameColor;
                ctx.fillRect(0, 0, 256, 256);
                ctx.fillStyle = color;
                const p = 16, s = 256 - p*2;
                ctx.beginPath();
                ctx.roundRect(p, p, s, s, 14);
                ctx.fill();
                material.map.needsUpdate = true;
            });
        }

        // --- Build Cube ---
        faceColors.forEach(col => {
            const tex = new THREE.CanvasTexture(createTextureCanvas(col));
            tex.colorSpace = THREE.SRGBColorSpace;
            materials.push(new THREE.MeshBasicMaterial({ map: tex }));
        });

        const geom = new THREE.BoxGeometry(0.97, 0.97, 0.97);
        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const cubie = new THREE.Mesh(geom, materials);
                    cubie.position.set(x, y, z);
                    cubeGroup.add(cubie);
                    cubies.push(cubie);
                }
            }
        }
        scene.add(cubeGroup);

        // --- Animation Logic ---
        function rotateLayer(axis, layer, direction = 1) {
            if (isAnimating) return;
            isAnimating = true;

            const pivot = new THREE.Object3D();
            scene.add(pivot);

            const targets = cubies.filter(c => {
                const pos = new THREE.Vector3();
                c.getWorldPosition(pos);
                return Math.round(pos[axis]) === layer;
            });

            targets.forEach(t => pivot.attach(t));

            const duration = 200;
            const start = performance.now();
            const targetRot = (Math.PI / 2) * direction;

            function anim(time) {
                const elapsed = time - start;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 4);
                pivot.rotation[axis] = targetRot * ease;

                if (progress < 1) {
                    requestAnimationFrame(anim);
                } else {
                    pivot.updateMatrixWorld();
                    targets.forEach(t => cubeGroup.attach(t));
                    scene.remove(pivot);
                    isAnimating = false;
                    moveCount++;
                    moveCountEl.innerText = moveCount;
                }
            }
            requestAnimationFrame(anim);
        }

        async function shuffle() {
            if (isShuffling || isAnimating) return;
            isShuffling = true;
            shuffleBtn.innerText = "Mixing...";
            const moves = [
                { a: 'y', l: 1, d: -1 }, { a: 'y', l: -1, d: 1 },
                { a: 'x', l: -1, d: 1 }, { a: 'x', l: 1, d: -1 },
                { a: 'z', l: 1, d: -1 }, { a: 'z', l: -1, d: 1 }
            ];
            for (let i = 0; i < 15; i++) {
                const m = moves[Math.floor(Math.random() * moves.length)];
                rotateLayer(m.a, m.l, m.d * (Math.random() > 0.5 ? 1 : -1));
                await new Promise(r => setTimeout(r, 220));
            }
            isShuffling = false;
            shuffleBtn.innerText = "Shuffle";
        }

        // --- Interaction ---
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            const key = e.key.toUpperCase();
            const isShift = e.shiftKey;
            const dir = isShift ? -1 : 1;

            const moveMap = {
                'W': () => rotateLayer('y', 1, -dir),
                'S': () => rotateLayer('y', -1, dir),
                'A': () => rotateLayer('x', -1, dir),
                'D': () => rotateLayer('x', 1, -dir),
                'Q': () => rotateLayer('z', 1, -dir),
                'E': () => rotateLayer('z', -1, dir),
            };

            if (moveMap[key]) {
                e.preventDefault();
                showKeyFeedback(key);
                moveMap[key]();
            }
        });

        function showKeyFeedback(key) {
            const el = document.getElementById(`key-${key}`);
            if (el) {
                el.classList.add('bg-[#25212A]', 'text-[#FBF5F0]', 'translate-y-1', 'border-[#25212A]');
                el.classList.remove('bg-[#FBF5F0]', 'text-[#25212A]', 'border-[#DBD9E1]');
                setTimeout(() => {
                    el.classList.remove('bg-[#25212A]', 'text-[#FBF5F0]', 'translate-y-1', 'border-[#25212A]');
                    el.classList.add('bg-[#FBF5F0]', 'text-[#25212A]', 'border-[#DBD9E1]');
                }, 200);
            }
            activeKeyEl.innerText = key;
            activeKeyEl.classList.remove('opacity-0');
            setTimeout(() => activeKeyEl.classList.add('opacity-0'), 500);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animateLoop() {
            requestAnimationFrame(animateLoop);
            controls.update();
            renderer.render(scene, camera);
        }

        initUI();
        animateLoop();

    </script>
</body>
</html>
