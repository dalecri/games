<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E1826">
<title>2048 Bloom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
@font-face{font-family:'Alpha Lyrae';font-style:normal;font-weight:500;font-display:swap;src:url('https://heycristobal.com/my-style-guide/assets/fonts/AlphaLyrae-Medium.woff2') format('woff2')}
/* Quiet Pixel v3 night ground. The one accent follows the season: dawn (spring), sun (summer), lamp (autumn), moon (winter).
   Layout: two panes share one stage, the number board and the live isometric garden. Whichever you touch grows, the other goes compact.
   Portrait (phones, upright tablets) stacks them; landscape (PC, tablets on their side) puts them side by side beside a control rail. */
:root{
  color-scheme:dark;
  --void:#1E1826;--surface:#2A2233;--surface-2:#251F2D;--line:#3D3448;
  --text:#EDE7F2;--muted:#9B8FA8;--accent:#7FB8D9;
  --display:'Alpha Lyrae','Space Mono',ui-monospace,monospace;
  --ui:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,color-mix(in srgb,var(--accent) 9%,transparent),transparent 70%),var(--void);color:var(--text);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
#weather{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;margin:0 auto;display:grid;gap:12px;width:min(100%,640px);height:calc(100dvh - 32px);min-height:600px;
  grid-template:"head" auto "seasons" auto "stage" minmax(0,1fr) "basket" auto "controls" auto / minmax(0,1fr)}
header{grid-area:head;display:flex;align-items:center;justify-content:space-between;gap:12px}
.seasons{grid-area:seasons}.stage{grid-area:stage}.basket{grid-area:basket}.controls{grid-area:controls}

.brand{display:flex;align-items:center;gap:12px;min-width:0}
.badge{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.badge img{width:30px;height:30px;image-rendering:pixelated}
h1{font-family:var(--display);font-weight:500;font-size:clamp(20px,6vw,32px);letter-spacing:.04em;margin:0;line-height:1;white-space:nowrap}
.scores{display:flex;gap:8px}
.chip{min-width:74px;padding:7px 10px 8px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;text-align:center;position:relative}
.chip span{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em}
.chip strong{display:block;font-size:19px;line-height:1.35;font-variant-numeric:tabular-nums}
.plus{position:absolute;right:10px;top:-6px;font-size:12px;font-weight:700;color:var(--accent);pointer-events:none;animation:rise .8s var(--ease) forwards}
@keyframes rise{to{opacity:0;transform:translateY(-22px)}}
@media(max-width:440px){.badge{display:none}}

/* The year: four seasons, the current one filling as moves pass */
.seasons{display:grid;grid-template-columns:auto repeat(4,1fr);align-items:center;gap:10px;width:100%;min-height:44px;padding:0 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);letter-spacing:0}
.yr{font:700 11px var(--ui);letter-spacing:.14em;color:var(--muted);font-variant-numeric:tabular-nums}
.sea{display:flex;align-items:center;gap:7px;min-width:0;opacity:.38;transition:opacity 300ms var(--ease)}
.sea img{width:18px;height:18px;image-rendering:pixelated;flex:none}
.sea.now{opacity:1}.sea.past{opacity:.6}
.track{flex:1;height:4px;background:var(--line);display:block;overflow:hidden}
.fill{display:block;height:100%;width:0;background:var(--c);transition:width 200ms var(--ease)}

/* Stage: the pane with .on takes two thirds, the other one third */
.stage{position:relative;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.pane{flex:1 1 0;min-width:0;min-height:0;container:pane/size;display:grid;place-items:center;padding:8px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;
  transition:flex-grow 420ms var(--ease),background 300ms var(--ease),box-shadow 300ms var(--ease)}
.pane:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.pane.on{flex-grow:2;padding:12px;background:var(--surface);box-shadow:0 18px 48px #0005;cursor:default;border-color:var(--line)}
.pane:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.board{position:relative;width:min(100cqw,100cqh);aspect-ratio:1;container:board/inline-size;--gap:10px;touch-action:none}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);height:100%}
.cell{border-radius:11px;background:color-mix(in srgb,var(--accent) 5%,var(--surface-2));box-shadow:inset 0 2px 0 #0002;position:relative;transition:background 600ms var(--ease)}
.pane:not(.on) .cell{background:color-mix(in srgb,var(--accent) 5%,var(--void))}
.cell:after{content:'';position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;background:var(--line)}
#tiles,#petals{position:absolute;inset:0;pointer-events:none}
.tile{position:absolute;top:0;left:0;width:calc((100% - 3*var(--gap))/4);height:calc((100% - 3*var(--gap))/4);transition:transform 110ms var(--ease);will-change:transform;z-index:1}
.face{position:relative;height:100%;border-radius:11px;background:var(--bg);box-shadow:0 3px 0 var(--edge),0 6px 14px #0003;display:grid;place-items:center;overflow:hidden;transition:transform 140ms var(--ease)}
.face img{width:66%;height:66%;margin-top:9%;image-rendering:pixelated;image-rendering:crisp-edges}
.num{position:absolute;left:8%;top:6%;font-weight:700;color:var(--ink);font-size:calc((100cqw - 3*var(--gap))/4*var(--ns,.15));line-height:1;font-variant-numeric:tabular-nums}
.spawn .face{animation:spawn 180ms var(--ease)}
.merge .face{animation:merge 200ms var(--ease)}
.sunny .face{animation:sunny 420ms var(--ease)}
.night .face{animation:glow 3.2s ease-in-out infinite}
@keyframes spawn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes merge{50%{transform:scale(1.12)}}
@keyframes sunny{35%{transform:scale(1.24);filter:brightness(1.35)}70%{transform:scale(.97)}}
@keyframes glow{50%{box-shadow:0 3px 0 var(--edge),0 0 26px #b9a9d980}}
.tile.sel{z-index:3}
.sel .face{transform:translateY(-6%);box-shadow:0 0 0 3px var(--accent),0 12px 20px #0007;animation:none}
.hint .face{animation:ring 1.5s var(--ease) infinite}
@keyframes ring{0%{box-shadow:0 3px 0 var(--edge),0 0 0 0 var(--accent)}70%,100%{box-shadow:0 3px 0 var(--edge),0 0 0 9px transparent}}
.frozen .face img{filter:saturate(.35) brightness(1.08)}
.ice{position:absolute;inset:0;border-radius:11px;border:2px solid #D6EEFA;background:linear-gradient(135deg,#e6f5fdb0 0 16%,#bfe2f560 16% 21%,#e6f5fd45 21% 54%,#bfe2f570 54% 59%,#e6f5fd60 59%)}
.newice .ice{animation:frost 420ms var(--ease)}
@keyframes frost{from{opacity:0;transform:scale(1.25)}}
.beam{position:absolute;z-index:2;pointer-events:none;border-radius:13px;background:linear-gradient(120deg,#f2c94c3d,#f2c94c1a 50%,#f2c94c3d);box-shadow:0 0 0 2px #f2c94ca6,0 0 22px #f2c94c40;animation:shimmer 2.4s ease-in-out infinite}
.beam.row{left:-3px;width:calc(100% + 6px);top:calc(var(--n)*(25% + var(--gap)/4) - 3px);height:calc((100% - 3*var(--gap))/4 + 6px)}
.beam.col{top:-3px;height:calc(100% + 6px);left:calc(var(--n)*(25% + var(--gap)/4) - 3px);width:calc((100% - 3*var(--gap))/4 + 6px)}
@keyframes shimmer{50%{opacity:.62}}
.petal{position:absolute;width:5px;height:5px;background:var(--c);animation:burst 520ms var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(90deg);opacity:0}}
.fly{position:fixed!important;z-index:40;transform-origin:0 0;transition:transform 340ms var(--ease)!important;pointer-events:none;container-type:normal}
.fly .num{font-size:12px}
/* Compact board: a number minimap. Sprites step aside, the numbers stay readable. */
@container pane (max-width:250px) or (max-height:250px){
  .board{--gap:5px}
  .cell,.face,.ice{border-radius:6px}.cell:after{display:none}
  .face{box-shadow:0 2px 0 var(--edge)}.face img{display:none}
  .num{position:static;font-size:calc((100cqw - 3*var(--gap))/4*var(--ns,.15)*2.3)}
  .beam{border-radius:8px}
}
#iso{display:block;width:min(100cqw,calc(100cqh*264/180));aspect-ratio:264/180;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;outline:none}

.overlay{position:absolute;inset:0;z-index:5;border-radius:20px;background:#251f2ded;backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;animation:sheetIn 280ms var(--ease)}
.ov-label{font-size:11px;letter-spacing:.2em;color:var(--accent)}
.ov-total{font:500 clamp(48px,17vw,84px)/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* The basket: five picks a year, and only what is picked counts */
.basket{display:grid;grid-template-columns:repeat(5,minmax(0,72px));justify-content:center;gap:8px}
.slot{aspect-ratio:1;min-height:0;padding:0;border-radius:12px;border:1px dashed var(--line);background:transparent;position:relative;display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.slot:disabled{opacity:1}
.slot.next{border:1px solid var(--accent);background:var(--surface-2);cursor:pointer}
.slot.next.pulse{animation:slotring 1.5s var(--ease) infinite}
@keyframes slotring{0%{box-shadow:0 0 0 0 var(--accent)}70%,100%{box-shadow:0 0 0 8px transparent}}
.slot.full{border:0;background:var(--bg);box-shadow:0 3px 0 var(--edge)}
.slot img{width:60%;image-rendering:pixelated;margin-bottom:14%}
.slot.next img{opacity:.5}
.slot span{position:absolute;left:0;right:0;bottom:7%;text-align:center;font:700 10px var(--ui);color:var(--ink,var(--accent));font-variant-numeric:tabular-nums;letter-spacing:0}
.slot em{font:700 11px var(--ui);font-style:normal;color:var(--accent);letter-spacing:.04em}
.slot.incoming>*{visibility:hidden}
.slot.landed{animation:merge 220ms var(--ease)}

button{font:700 11px var(--ui);letter-spacing:.06em;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:44px;cursor:pointer;transition:transform 120ms var(--ease),border-color 200ms var(--ease),opacity 200ms,background 400ms var(--ease)}
button:hover{border-color:var(--accent)}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button.primary{background:var(--accent);color:#1E1826;border-color:var(--accent)}
button:disabled{opacity:.35;cursor:default;transform:none}
button[aria-pressed="false"]{color:var(--muted)}
.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:min(100%,440px);margin:0 auto}
.controls button{padding:0 6px}

/* Landscape: PC, and tablets or phones on their side. A control rail on the left, both panes side by side. */
@media(min-width:700px) and (min-aspect-ratio:1/1){
  main{width:min(100%,1280px);min-height:340px;column-gap:20px;
    grid-template:"head stage" auto "seasons stage" auto "basket stage" auto ". stage" minmax(0,1fr) "controls stage" auto / 300px minmax(0,1fr)}
  .stage{flex-direction:row}.pane.on{flex-grow:1.6}
  header{flex-wrap:wrap}.scores{width:100%}.chip{flex:1}
  .badge{display:grid}h1{font-size:30px}
}
@media(min-width:700px) and (min-aspect-ratio:1/1) and (max-height:480px){
  main{row-gap:8px}.badge{display:none}h1{font-size:20px}.chip{padding-block:3px 4px}.chip strong{font-size:16px}
  .seasons,button{min-height:36px}.basket{grid-template-columns:repeat(5,minmax(0,48px))}.slot.full span,.slot.next span{font-size:9px}
}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--accent);box-shadow:0 12px 32px #0006;animation:toastIn 280ms var(--ease);white-space:nowrap;pointer-events:none}
.toast .swatch{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface-2)}
.toast .swatch img{width:32px;height:32px;image-rendering:pixelated}
.toast small{display:block;font-size:10px;letter-spacing:.18em;color:var(--accent)}
.toast b{display:inline-block;font:500 20px/1.2 var(--display);letter-spacing:.03em;animation:pulse 650ms var(--ease)}
@keyframes pulse{40%{transform:scale(1.16)}}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{transform:translate(-50%,0)}}

.scrim{position:fixed;inset:0;z-index:30;background:#120e18b3;display:flex;align-items:flex-end;justify-content:center;animation:fade 280ms var(--ease)}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,520px);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));animation:sheetIn 280ms var(--ease)}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet h2{font:500 26px/1 var(--display);margin:0;letter-spacing:.03em}
.count{color:var(--muted);font-size:11px;letter-spacing:.12em;margin-top:6px;font-variant-numeric:tabular-nums}
.close{width:44px;padding:0;font-size:16px}
.almanac{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.alm{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.alm img{width:27px;height:27px;image-rendering:pixelated;flex:none}
.alm b{display:block;font-size:11px;letter-spacing:.1em}
.alm span{display:block;font-size:10px;color:var(--muted);line-height:1.35;margin-top:2px}
.journal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
@media(min-width:460px){.journal{grid-template-columns:repeat(6,1fr)}}
.entry{border-radius:12px;background:var(--surface-2);border:1px solid var(--line);padding:6px 6px 8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.entry .pic{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;background:var(--bg,var(--void))}
.entry .pic img{width:62%;image-rendering:pixelated}
.entry b{font-size:10px;line-height:1.25;overflow-wrap:anywhere}
.entry.locked b{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</head>
<body>
<canvas id="weather" aria-hidden="true"></canvas>
<main>
  <header>
    <div class="brand"><div class="badge"><img id="badge" alt="" width="30" height="30"></div><h1>2048 Bloom</h1></div>
    <div class="scores">
      <div class="chip"><span>HARVEST</span><strong id="score">0</strong></div>
      <div class="chip"><span>BEST</span><strong id="best">0</strong></div>
    </div>
  </header>
  <button id="seasons" class="seasons"><span class="yr" id="yr">Y1</span></button>
  <div class="stage">
    <section id="paneBoard" class="pane on" aria-label="Number board">
      <div id="board" class="board" tabindex="0" role="group" aria-label="Garden board. Arrow keys, WASD or swipe to move. H to choose a bloom for the basket, U to undo, G to swap the large view.">
        <div class="cells" aria-hidden="true"></div>
        <div id="tiles"></div>
        <div id="beam" class="beam" hidden aria-hidden="true"></div>
        <div id="petals" aria-hidden="true"></div>
      </div>
    </section>
    <section id="paneGarden" class="pane" aria-label="Garden">
      <canvas id="iso" width="264" height="180" tabindex="0" role="img" aria-label="Your garden"></canvas>
    </section>
    <div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="ovLabel">
      <div class="ov-label" id="ovLabel"></div>
      <div class="ov-total" id="ovTotal"></div>
      <div class="row"><button id="plant" class="primary">Plant</button><button id="ovUndo">Undo</button></div>
    </div>
  </div>
  <div id="basket" class="basket" role="group" aria-label="Basket"></div>
  <div class="controls">
    <button id="new">New</button>
    <button id="undo" disabled>Undo</button>
    <button id="almanacBtn">Almanac</button>
    <button id="sound" aria-pressed="true">Sound</button>
  </div>
</main>
<div id="toast" class="toast" hidden role="status"></div>
<div id="scrim" class="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gTitle">
    <div class="sheet-head"><div><h2 id="gTitle">Almanac</h2><div class="count" id="gCount"></div></div><button class="close" id="gClose" aria-label="Close almanac">✕</button></div>
    <div class="almanac" id="almanac"></div>
    <div class="count" id="jCount"></div>
    <div class="journal" id="journal"></div>
  </div>
</div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
'use strict';
const KEY='bloom2048.v2',LEN=20,SLOTS=5,PLOTS=48;
// A year is four seasons of LEN moves. Each season bends one rule.
const SEASONS=[
 {name:'Spring',c:'#7FB8D9',art:'drop',rule:'Frost thaws'},
 {name:'Summer',c:'#F2C94C',art:'sun', rule:'Sunlit merges grow twice'},
 {name:'Autumn',c:'#E8873A',art:'leaf',rule:'Picks count double'},
 {name:'Winter',c:'#B9A9D9',art:'snow',rule:'Frost pins blooms'}
];
const ICON={
 drop:['....x....','....x....','...xxx...','...xxx...','..xxxxx..','.xxxxxxx.','.xXxxxxx.','.xxxxxxx.','..xxxxx..'],
 sun: ['....x....','.x.....x.','...xxx...','..xxxxx..','x.xxxxx.x','..xxxxx..','...xxx...','.x.....x.','....x....'],
 leaf:['.........','.....xx..','...xxxxx.','..xxxXxx.','..xxXxxx.','.xxXxxx..','.xXxxx...','.Xxx.....','X........'],
 snow:['....x....','.x..x..x.','..x.x.x..','...xxx...','xxxxxxxxx','...xxx...','..x.x.x..','.x..x..x.','....x....']
};
// Global sprite colors; p/P (petal + shade) and d (soil) come from each tier.
const INK={g:'#4E8F62',l:'#86C78A',w:'#FFFFFF',y:'#F2C94C',Y:'#D99A2B',b:'#8A6455',o:'#E39A7C',O:'#C2735A',c:'#F5EBDD',m:'#FFF1BF','*':'#FFF1BF'};
const SOIL=['.dddddddddd.','..dddddddd..'];
const ART={
 seed:['............','............','............','............','............','............','.....pp.....','....pPPp....','....pPPp....','.....pp.....',...SOIL],
 sprout:['............','............','............','............','......ll....','.....lgl....','....lgg.....','.....g......','.....g......','.....g......',...SOIL],
 seedling:['............','............','............','.ll......ll.','lllg....glll','.llgg..ggll.','....gggg....','.....gg.....','.....gg.....','.....gg.....',...SOIL],
 bud:['............','.....pp.....','....pPPp....','....pPPp....','.....gg.....','.....gg.....','.ll..gg..ll.','lllg.gg.glll','.llggggggll.','.....gg.....',...SOIL],
 tulip:['............','...p.pp.p...','...pppppp...','...pPppPp...','...pPPPPp...','....pPPp....','.....gg.....','.ll..gg..ll.','lllg.gg.glll','.llggggggll.',...SOIL],
 daisy:['............','.....ww.....','..w.wwww.w..','...wwwwww...','.wwwwyywwww.','.wwwyYYywww.','.wwwwyywwww.','...wwwwww...','..w.wwww.w..','.....gg.....',...SOIL],
 toadstool:['............','....pppp....','..pppwwppp..','.ppwwppppwp.','.pppppppwwp.','pppwwppppppp','.PPPPPPPPPP.','....cccc....','....cccc....','....cccc....',...SOIL],
 lavender:['.....p......','....pPp.....','.....p..p...','....pPp.pPp.','.p...p...p..','pPp.pPp.pPp.','.p...g...p..','..g..g..g...','...g.g.g....','....ggg.....',...SOIL],
 rose:['....pppp....','...pPPpPp...','...ppPPpp...','....pppp....','..ll.gg.ll..','.lllggggll..','..ll.gg.l...','..OOOOOOOO..','..oooooooo..','...oooooo...','...oooooo...','....oooo....'],

$('paneBoard').addEventListener('pointerdown',()=>setFocus('board'));
$('paneGarden').addEventListener('pointerdown',()=>setFocus('garden'));

// Live isometric garden. An 8×8 island on a 264×180 canvas: the middle 4×4 bed is this year's board, mirrored move for move;
// the 48 plots around it keep every harvest. Pixel-stepped 2:1 diamonds, plants at 2× their tile sprite.
const G=8,B0=2,TW=32,TH=16,DEPTH=9,PW=264,PH=180,TOP=36;
const iso=$('iso'),ix=iso.getContext('2d'),gnd=document.createElement('canvas');gnd.width=PW;gnd.height=PH;
const cellXY=(gx,gy)=>[PW/2+(gx-gy)*TW/2,TOP+(gx+gy)*TH/2+TH/2],bedXY=i=>cellXY(B0+i%4,B0+Math.floor(i/4));
const inBed=(gx,gy)=>gx>=B0&&gx<B0+4&&gy>=B0&&gy<B0+4;
const RING=[];for(let gy=0;gy<G;gy++)for(let gx=0;gx<G;gx++)if(!inBed(gx,gy))RING.push([gx,gy]);
// Grass per season: two checker tones and a tuft color.
const GRASS=[['#3B5C48','#365441','#4F7A62'],['#47683F','#41603A','#6A9152'],['#5C5838','#545033','#8A7240'],['#4E5969','#475262','#DCE6EE']];
let gndKey='',mv=null,grow=null,isoUntil=0,isoRaf=0;
function diamond(x,cx,cy,l,r){for(let k=0;k<TH;k++){const h=(k<TH/2?k+1:TH-k)*2;x.fillStyle=l;x.fillRect(cx-h,cy-TH/2+k,h,1);x.fillStyle=r;x.fillRect(cx,cy-TH/2+k,h,1)}}
function drawGround(){const s=seasonOf(state.moves),key=s+'|'+state.garden.map(g=>g?1:0).join('');if(key===gndKey)return;gndKey=key;const x=gnd.getContext('2d'),[ga,gb,gt]=GRASS[s];x.clearRect(0,0,PW,PH);
 for(let gy=0;gy<G;gy++)for(let gx=0;gx<G;gx++){if(gx!==G-1&&gy!==G-1)continue;const[cx,cy]=cellXY(gx,gy);for(let d=DEPTH;d>0;d--)diamond(x,cx,cy+d,d>DEPTH-2?'#2C2030':'#3D2C32',d>DEPTH-2?'#35273A':'#4B363A')}
 for(let gy=0;gy<G;gy++)for(let gx=0;gx<G;gx++){const[cx,cy]=cellXY(gx,gy),alt=(gx+gy)%2,p=gy*G+gx;
  if(inBed(gx,gy)){const c=alt?'#5A453D':'#503D36';diamond(x,cx,cy,c,c);x.fillStyle='#3F302B';x.fillRect(cx-4,cy,8,1)}
  else{const c=alt?ga:gb;diamond(x,cx,cy,c,c);x.fillStyle=gt;x.fillRect(cx-6+(p*7)%9,cy-1+(p*3)%3,1,2);x.fillRect(cx+2-(p*5)%7,cy+1-(p%2),1,2)}}
 state.garden.forEach((it,k)=>{if(!it)return;const[cx,cy]=cellXY(...RING[k]);x.fillStyle='#4E3B33';x.fillRect(cx-8,cy-2,16,5);x.fillRect(cx-5,cy-3,10,7)})}
const plantCache={};
function plantCv(t,ice){const k=t.v+(ice?'i':'');if(plantCache[k])return plantCache[k];const c=document.createElement('canvas');c.width=c.height=24;const x=c.getContext('2d');let last=0;
 ART[t.art].forEach((row,r)=>[...row].forEach((ch,col)=>{if(ch==='.'||ch==='d')return;last=r;const ink=inkOf(t,ch);x.fillStyle=ice?mix(ink,'#D6EEFA',.6):ink;x.fillRect(col*2,r*2,2,2)}));
 return plantCache[k]={c,last,float:t.art==='moonrise'}}
function drawPlant(x,v,cx,cy,dy,a,ice){const p=plantCv(tierOf(v),ice);cx=Math.round(cx);cy=Math.round(cy);x.globalAlpha=a*.3;x.fillStyle='#000';x.fillRect(cx-7,cy+1,14,3);x.globalAlpha=a;x.drawImage(p.c,cx-12,cy+(p.float?-6:3)-(p.last+1)*2+dy);x.globalAlpha=1}
function isoDraw(now){drawGround();const x=ix,acc=SEASONS[seasonOf(state.moves)].c;x.clearRect(0,0,PW,PH);x.drawImage(gnd,0,0);
 if(state.beam)for(let i=0;i<16;i++)if(inBeam(i,state.beam)){const[cx,cy]=bedXY(i);x.globalAlpha=.34;diamond(x,cx,cy,'#F2C94C','#F2C94C');x.globalAlpha=1}
 const mark=sel>=0?sel:hintIdx;if(mark>=0&&state.grid[mark]){const[cx,cy]=bedXY(mark);x.globalAlpha=sel>=0?.8:.4+.25*Math.sin(now/240);diamond(x,cx,cy,acc,acc);x.globalAlpha=1}
 const list=[];
 state.garden.forEach((it,k)=>{if(!it)return;const[cx,cy]=cellXY(...RING[k]);let dy=0,a=1;const n=grow?grow.idx.indexOf(k):-1;
  if(n>=0){const q=(now-grow.t0-250-n*150)/380;if(q<0)return;if(q<1){a=Math.min(1,q*3);dy=-Math.round(Math.sin(q*Math.PI)*8+(1-q)*6)}}list.push([cy,cx,it.v,dy,a,false])});
 const q=mv?(now-mv.t0)/mv.dur:2;
 if(mv&&q<1){const e=q*q*(3-2*q);mv.list.forEach(m=>{const a=bedXY(m.from),b=bedXY(m.to);list.push([a[1]+(b[1]-a[1])*e,a[0]+(b[0]-a[0])*e,mv.old[m.from],0,1,m.ice])})}
 else state.grid.forEach((v,i)=>{if(!v)return;const[cx,cy]=bedXY(i);let dy=0,a=1;
  if(mv){const k=(now-mv.t0-mv.dur)/260;if(k<1){if(mv.merged.includes(i))dy=-Math.round(Math.sin(k*Math.PI)*(mv.sunny.includes(i)?10:5));else if(i===mv.sp)a=Math.min(1,.1+k*1.8)}}
  list.push([cy,cx,v,dy,a,state.frozen.includes(i)])});
 list.sort((a,b)=>a[0]-b[0]).forEach(p=>drawPlant(x,p[2],p[1],p[0],p[3],p[4],p[5]))}
function isoLoop(now){isoRaf=0;isoDraw(now);if(now<isoUntil||(hintIdx>=0&&sel<0&&!reduce.matches&&$('scrim').hidden))isoRaf=requestAnimationFrame(isoLoop)}
function isoKick(ms){isoUntil=Math.max(isoUntil,performance.now()+ms);if(!isoRaf)isoRaf=requestAnimationFrame(isoLoop)}
function isoMove(old,nx,walls,sp){if(reduce.matches){mv=null;return}mv={old,list:[...nx.motions.map(m=>({...m,ice:false})),...walls.map(i=>({from:i,to:i,ice:true}))],merged:nx.merged,sunny:nx.sunny,sp,t0:performance.now(),dur:120};isoKick(420)}
function isoPlant(idx){if(!idx.length||reduce.matches){grow=null;isoKick(0);return}grow={idx,t0:performance.now()};isoKick(700+idx.length*150)}
// The garden plays too. Its grid is turned 45°, so swipes run along the diagonals: up-right is the board's up, down-right its right.
let gp=null;iso.addEventListener('pointerdown',e=>{if(!e.isPrimary||state.focus!=='garden')return;gp={x:e.clientX,y:e.clientY,id:e.pointerId};try{iso.setPointerCapture(e.pointerId)}catch(_){}});
iso.addEventListener('pointerup',e=>{if(!gp||gp.id!==e.pointerId)return;const dx=e.clientX-gp.x,dy=e.clientY-gp.y,d=Math.hypot(dx,dy);gp=null;
 if(d>=22)return void move(dx>0?(dy<0?'up':'right'):(dy>0?'down':'left'));if(d>8)return;
 const r=iso.getBoundingClientRect(),lx=(e.clientX-r.left)/r.width*PW,ly=(e.clientY-r.top)/r.height*PH+11,u=(lx-PW/2)/(TW/2),w=(ly-TOP)/(TH/2),gx=Math.floor((u+w)/2),gy=Math.floor((w-u)/2);
 tapCell(inBed(gx,gy)?(gy-B0)*4+gx-B0:-1)});
iso.addEventListener('pointercancel',()=>gp=null);

function openAlmanac(){const n=state.garden.filter(Boolean),sum=n.reduce((a,b)=>a+b.pts,0);
 $('gCount').textContent=`${n.length} OF ${PLOTS} PLANTED · ${fmt(sum)}`;
 $('almanac').innerHTML=SEASONS.map(s=>`<div class="alm"><img alt="" src="${icon(s)}"><div><b>${s.name.toUpperCase()}</b><span>${s.rule}</span></div></div>`).join('');
 const box=$('journal');box.replaceChildren();let got=0;
 TIERS.forEach(t=>{const has=state.found.includes(t.v)||state.found.some(v=>v>4096&&t.v===4096);if(has)got++;const e=document.createElement('div');e.className='entry'+(has?'':' locked');
  e.innerHTML=`<div class="pic" style="${has?'--bg:'+t.bg:''}"><img alt="" src="${sprite(t,!has)}"></div><b>${has?t.name:t.v}</b>`;box.append(e)});
 $('jCount').textContent=`${got} OF ${TIERS.length} BLOOMS`;$('scrim').hidden=false;document.querySelector('.sheet').scrollTop=0;$('gClose').focus({preventScroll:true})}
function closeAlmanac(){$('scrim').hidden=true;board.focus({preventScroll:true});isoKick(0)}

$('new').onclick=newGame;$('undo').onclick=undo;$('ovUndo').onclick=undo;$('plant').onclick=plant;
$('sound').onclick=()=>{state.mute=!state.mute;unlockAudio();save();render()};
$('almanacBtn').onclick=openAlmanac;$('seasons').onclick=openAlmanac;$('gClose').onclick=closeAlmanac;$('scrim').addEventListener('click',e=>{if(e.target===e.currentTarget)closeAlmanac()});
const keys={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};
// With a bloom chosen, arrows walk the choice between blooms instead of sliding the board.
function walk(dir){const c=sel%4,r=Math.floor(sel/4);let best=-1,bd=99;state.grid.forEach((v,i)=>{if(!v||i===sel)return;const dc=i%4-c,dr=Math.floor(i/4)-r,along=dir==='left'?-dc:dir==='right'?dc:dir==='up'?-dr:dr,across=dir==='left'||dir==='right'?Math.abs(dr):Math.abs(dc);if(along<=0)return;const d=along+across*2;if(d<bd){bd=d;best=i}});if(best>=0){sel=best;sound('select');paintSel()}}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(!$('scrim').hidden){if(e.key==='Escape')closeAlmanac();return}
 const k=e.key.length===1?e.key.toLowerCase():e.key,onBtn=e.target.closest&&e.target.closest('button');
 if(k==='g'){setFocus(state.focus==='garden'?'board':'garden');return}
 if(sel>=0){if(keys[k]){e.preventDefault();walk(keys[k])}else if((k==='Enter'||k===' ')&&!onBtn){e.preventDefault();harvest(sel)}else if(k==='Escape'||k==='h'){sel=-1;paintSel()}return}
 if(keys[k]){e.preventDefault();move(keys[k])}else if(k==='u')undo();else if((k==='h'||k==='Enter')&&!onBtn&&!state.done){e.preventDefault();slotTap()}});
let ptr=null;board.addEventListener('pointerdown',e=>{if(!e.isPrimary||state.focus!=='board')return;ptr={x:e.clientX,y:e.clientY,id:e.pointerId};try{board.setPointerCapture(e.pointerId)}catch(_){}});
board.addEventListener('pointerup',e=>{if(!ptr||ptr.id!==e.pointerId)return;const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y,d=Math.max(Math.abs(dx),Math.abs(dy));ptr=null;
 if(d>=22)return void move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));if(d>8)return;
 measure();const r=board.getBoundingClientRect();tapCell(Math.min(3,Math.max(0,Math.floor((e.clientY-r.top)/step)))*4+Math.min(3,Math.max(0,Math.floor((e.clientX-r.left)/step))))});
board.addEventListener('pointercancel',()=>ptr=null);
for(let i=0;i<16;i++){const c=document.createElement('div');c.className='cell';document.querySelector('.cells').append(c)}

// Weather: rain in spring, sun motes in summer, drifting leaves in autumn, snow in winter.
(function(){const cv=$('weather'),x=cv.getContext('2d');let W,H,ps=[];const dpr=Math.min(2,devicePixelRatio||1);
 function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);ps=Array.from({length:Math.round(Math.min(34,W*H/22000))},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*6.28,v:.6+Math.random()*.8,z:Math.random()<.3?3:2}))}
 function draw(t){x.clearRect(0,0,W,H);const s=seasonOf(state.moves),still=reduce.matches;ps.forEach(f=>{
   if(!still){if(s===0){f.y+=f.v*3;f.x-=f.v*.6}else if(s===1){f.y-=f.v*.14;f.x+=Math.sin(t/2400+f.s)*.18}else if(s===2){f.y+=f.v*.5;f.x+=.3+Math.sin(t/900+f.s)*.6}else{f.y+=f.v*.3;f.x+=Math.sin(t/1600+f.s)*.3}
    if(f.y<-10){f.y=H+4;f.x=Math.random()*W}if(f.y>H+10){f.y=-6;f.x=Math.random()*W}if(f.x<-10)f.x=W+4;if(f.x>W+10)f.x=-6}
   const tw=.5+.5*Math.sin(t/900+f.s*3),px=Math.round(f.x),py=Math.round(f.y);
   if(s===0){x.globalAlpha=.2;x.fillStyle='#7FB8D9';x.fillRect(px,py,2,f.z*3)}
   else if(s===1){x.globalAlpha=.12+.24*tw;x.fillStyle=f.z===3?'#F2C94C':'#F6E3A1';x.fillRect(px,py,f.z,f.z)}
   else if(s===2){x.globalAlpha=.34;x.fillStyle=f.z===3?'#E8873A':'#C9583F';x.fillRect(px,py,f.z+1,f.z)}
   else{x.globalAlpha=.24+.2*tw;x.fillStyle='#EDE7F2';x.fillRect(px,py,f.z,f.z)}});
  x.globalAlpha=1;if(!still)requestAnimationFrame(draw)}
 size();addEventListener('resize',size);requestAnimationFrame(draw)})();

if(load())render();else startRun();
applyFocus();
</script>
