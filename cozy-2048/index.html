<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E1826">
<title>2048 Bloom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap">
<style>
@font-face{font-family:'Alpha Lyrae';font-style:normal;font-weight:500;font-display:swap;src:url('https://heycristobal.com/my-style-guide/assets/fonts/AlphaLyrae-Medium.woff2') format('woff2')}
/* Layout: one centered column, board as the hero; Quiet Pixel night ground, pastel tiles are the only loud color */
:root{
  color-scheme:dark;
  --void:#1E1826;--surface:#2A2233;--surface-2:#251F2D;--line:#3D3448;
  --text:#EDE7F2;--muted:#9B8FA8;--moon:#B9A9D9;--ring:rgba(185,169,217,.16);
  --display:'Alpha Lyrae','Space Mono',ui-monospace,monospace;
  --ui:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.4,0,.2,1);
  --gap:10px;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,#b9a9d914,transparent 70%),var(--void);color:var(--text);font-family:var(--ui);
  -webkit-user-select:none;user-select:none;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px}
#fireflies{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;width:min(100%,440px);margin:0 auto;display:flex;flex-direction:column;gap:18px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.badge{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.badge img{width:30px;height:30px;image-rendering:pixelated}
h1{font-family:var(--display);font-weight:500;font-size:clamp(28px,7.5vw,38px);letter-spacing:.04em;margin:0;line-height:1;text-wrap:balance}
.scores{display:flex;gap:8px}
.chip{min-width:84px;padding:7px 14px 8px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;text-align:center;position:relative}
.chip span{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em}
.chip strong{display:block;font-size:19px;line-height:1.35;font-variant-numeric:tabular-nums}
.plus{position:absolute;right:10px;top:-6px;font-size:12px;font-weight:700;color:var(--moon);pointer-events:none;animation:rise .7s var(--ease) forwards}
@keyframes rise{to{opacity:0;transform:translateY(-22px)}}

.panel{position:relative;padding:12px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 48px #0005}
.board{position:relative;aspect-ratio:1;max-width:100%;touch-action:none;outline:none}
.board:focus-visible{outline:2px solid var(--moon);outline-offset:6px;border-radius:10px}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);height:100%}
.cell{border-radius:11px;background:var(--surface-2);box-shadow:inset 0 2px 0 #0002;position:relative}
.cell:after{content:'';position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;background:var(--line)}
#tiles,#petals{position:absolute;inset:0;pointer-events:none}
.tile{position:absolute;top:0;left:0;width:calc((100% - 3*var(--gap))/4);height:calc((100% - 3*var(--gap))/4);transition:transform 110ms var(--ease);will-change:transform;z-index:1}
.face{position:relative;height:100%;border-radius:11px;background:var(--bg);box-shadow:0 3px 0 var(--edge),0 6px 14px #0003;display:grid;place-items:center;overflow:hidden}
.face img{width:66%;height:66%;margin-top:9%;image-rendering:pixelated;image-rendering:crisp-edges}
.num{position:absolute;left:8%;top:6%;font-weight:700;color:var(--ink);font-size:calc(var(--cell,90px)*var(--ns,.15));line-height:1;font-variant-numeric:tabular-nums}
.spawn .face{animation:spawn 180ms var(--ease)}
.merge .face{animation:merge 200ms var(--ease)}
.night .face{animation:glow 3.2s ease-in-out infinite}
.night.merge .face{animation:merge 200ms var(--ease),glow 3.2s ease-in-out infinite}
@keyframes spawn{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes merge{50%{transform:scale(1.12)}}
@keyframes glow{50%{box-shadow:0 3px 0 var(--edge),0 0 26px #b9a9d980}}
.petal{position:absolute;width:5px;height:5px;background:var(--c);animation:burst 520ms var(--ease) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(90deg);opacity:0}}

.overlay{position:absolute;inset:0;z-index:5;border-radius:19px;background:#251f2ded;backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;animation:sheetIn 280ms var(--ease)}
.overlay img{width:72px;height:72px;image-rendering:pixelated}
.overlay h2{font:500 clamp(24px,7vw,34px)/1.1 var(--display);margin:0;letter-spacing:.03em;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

button{font:700 11px var(--ui);letter-spacing:.06em;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:44px;cursor:pointer;transition:transform 120ms var(--ease),border-color 200ms var(--ease),opacity 200ms}
button:hover{border-color:var(--moon)}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--moon);outline-offset:3px}
button.primary{background:var(--moon);color:#1E1826;border-color:var(--moon)}
button:disabled{opacity:.35;cursor:default;transform:none}
button[aria-pressed="false"]{color:var(--muted)}
.controls{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:8px}
@media(max-width:380px){.controls{grid-template-columns:1fr 1fr}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--moon);box-shadow:0 12px 32px #0006}
.toast .swatch{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none}
.toast .swatch img{width:32px;height:32px;image-rendering:pixelated}
.toast small{display:block;font-size:10px;letter-spacing:.18em;color:var(--moon)}
.toast b{display:inline-block;font:500 20px/1.2 var(--display);letter-spacing:.03em;animation:pulse 650ms var(--ease)}
@keyframes pulse{40%{transform:scale(1.16);text-shadow:0 0 14px #b9a9d999}}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px)}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{transform:translate(-50%,0)}}
.toast{animation:toastIn 280ms var(--ease)}

.scrim{position:fixed;inset:0;z-index:30;background:#120e18b3;display:flex;align-items:flex-end;justify-content:center;animation:fade 280ms var(--ease)}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,520px);max-height:86vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));animation:sheetIn 280ms var(--ease)}
@media(min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;border-bottom:1px solid var(--line)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sheet h2{font:500 26px/1 var(--display);margin:0;letter-spacing:.03em}
.count{color:var(--muted);font-size:11px;letter-spacing:.12em;margin-top:6px}
.close{width:44px;padding:0;font-size:16px}
.journal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:460px){.journal{grid-template-columns:repeat(4,1fr)}}
.entry{border-radius:14px;background:var(--surface-2);border:1px solid var(--line);padding:8px 8px 10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.entry .pic{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;background:var(--bg,transparent)}
.entry .pic img{width:62%;image-rendering:pixelated}
.entry.locked .pic{background:var(--void)}
.entry b{font-size:11px;line-height:1.25;overflow-wrap:anywhere}
.entry span{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.entry.locked b{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</head>
<body>
<canvas id="fireflies" aria-hidden="true"></canvas>
<main>
  <header>
    <div class="brand"><div class="badge"><img id="badge" alt="" width="30" height="30"></div><h1>2048 Bloom</h1></div>
    <div class="scores">
      <div class="chip"><span>SCORE</span><strong id="score">0</strong></div>
      <div class="chip"><span>BEST</span><strong id="best">0</strong></div>
    </div>
  </header>
  <section class="panel" aria-label="Game board">
    <div id="board" class="board" tabindex="0" role="group" aria-label="2048 Bloom board. Arrow keys, WASD or swipe to move. U to undo.">
      <div class="cells" aria-hidden="true"></div>
      <div id="tiles"></div>
      <div id="petals" aria-hidden="true"></div>
    </div>
    <div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="message">
      <img id="ovImg" alt="">
      <h2 id="message"></h2>
      <div class="row"><button id="keep" class="primary">Keep growing</button><button id="ovUndo">Undo</button><button id="restart">New garden</button></div>
    </div>
  </section>
  <div class="controls">
    <button id="new" class="primary">New garden</button>
    <button id="undo" disabled>Undo</button>
    <button id="journalBtn">Journal</button>
    <button id="sound" aria-pressed="true">Sound</button>
  </div>
</main>
<div id="toast" class="toast" hidden role="status"></div>
<div id="scrim" class="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="jTitle">
    <div class="sheet-head"><div><h2 id="jTitle">Garden journal</h2><div class="count" id="jCount"></div></div><button class="close" id="jClose" aria-label="Close journal">✕</button></div>
    <div class="journal" id="journal"></div>
  </div>
</div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
'use strict';
const KEY='bloom2048.v1';
// Global sprite colors; p/P (petal + shade) and d (soil) come from each tier.
const INK={g:'#4E8F62',l:'#86C78A',w:'#FFFFFF',y:'#F2C94C',Y:'#D99A2B',b:'#8A6455',o:'#E39A7C',O:'#C2735A',c:'#F5EBDD',m:'#FFF1BF','*':'#FFF1BF'};
const SOIL=['.dddddddddd.','..dddddddd..'];
const ART={
 seed:['............','............','............','............','............','............','.....pp.....','....pPPp....','....pPPp....','.....pp.....',...SOIL],
 sprout:['............','............','............','............','......ll....','.....lgl....','....lgg.....','.....g......','.....g......','.....g......',...SOIL],
 seedling:['............','............','............','.ll......ll.','lllg....glll','.llgg..ggll.','....gggg....','.....gg.....','.....gg.....','.....gg.....',...SOIL],
 bud:['............','.....pp.....','....pPPp....','....pPPp....','.....gg.....','.....gg.....','.ll..gg..ll.','lllg.gg.glll','.llggggggll.','.....gg.....',...SOIL],
 tulip:['............','...p.pp.p...','...pppppp...','...pPppPp...','...pPPPPp...','....pPPp....','.....gg.....','.ll..gg..ll.','lllg.gg.glll','.llggggggll.',...SOIL],
 daisy:['............','.....ww.....','..w.wwww.w..','...wwwwww...','.wwwwyywwww.','.wwwyYYywww.','.wwwwyywwww.','...wwwwww...','..w.wwww.w..','.....gg.....',...SOIL],
 toadstool:['............','....pppp....','..pppwwppp..','.ppwwppppwp.','.pppppppwwp.','pppwwppppppp','.PPPPPPPPPP.','....cccc....','....cccc....','....cccc....',...SOIL],
 lavender:['.....p......','....pPp.....','.....p..p...','....pPp.pPp.','.p...p...p..','pPp.pPp.pPp.','.p...g...p..','..g..g..g...','...g.g.g....','....ggg.....',...SOIL],
 rose:['....pppp....','...pPPpPp...','...ppPPpp...','....pppp....','..ll.gg.ll..','.lllggggll..','..ll.gg.l...','..OOOOOOOO..','..oooooooo..','...oooooo...','...oooooo...','....oooo....'],
 cherry:['..pp....pp..','.pwpp..ppwp.','..pp.pp.pp..','....pwpp....','.pp..pp..pp.','pwpp.bb.ppwp','.pp.bbb..pp.','....b.b.....','.....bb.....','.....bb.....',...SOIL],
 moontree:['...pppppp...','.pppwppppPp.','pppppppwpppp','pPppwppppppp','.ppppppPppp.','..pppbbppp..','.....bb.....','.....bb.....','....bbbb....','...bb..bb...',...SOIL],
 moonrise:['............','.....mmm..*.','....mm......','...mm.......','...mm.....*.','...mm.......','...mmm......','....mmm.....','.....mmmm...','..*.........','........*...','............']
};
// value → look. The last tier repeats for anything past it.
const TIERS=[
 {v:2,   name:'Seed',        art:'seed',     bg:'#EEE6F4',ink:'#5B4B70',p:'#CFA67D',P:'#A47A52'},
 {v:4,   name:'Sprout',      art:'sprout',   bg:'#E3F1E3',ink:'#3F6150'},
 {v:8,   name:'Seedling',    art:'seedling', bg:'#D5EDE4',ink:'#2F5A50'},
 {v:16,  name:'Bud',         art:'bud',      bg:'#F8E0EA',ink:'#7A3A55',p:'#EC8FAE',P:'#C9628A'},
 {v:32,  name:'Tulip',       art:'tulip',    bg:'#FCE5D6',ink:'#7A402C',p:'#F08A6C',P:'#C9583F'},
 {v:64,  name:'Daisy',       art:'daisy',    bg:'#D6E6F8',ink:'#34506E'},
 {v:128, name:'Toadstool',   art:'toadstool',bg:'#ECE2F8',ink:'#4E3C70',p:'#E8707F',P:'#B44E5E'},
 {v:256, name:'Lavender',    art:'lavender', bg:'#DFE6FA',ink:'#384680',p:'#9C82D6',P:'#7357B3'},
 {v:512, name:'Potted rose', art:'rose',     bg:'#D3EEEA',ink:'#285A55',p:'#F29BB7',P:'#CF6990'},
 {v:1024,name:'Cherry bough',art:'cherry',   bg:'#E6DFF7',ink:'#4A3C70',p:'#F7AFC6',P:'#E28AAB'},
 {v:2048,name:'Moon tree',   art:'moontree', bg:'#3B2F55',ink:'#F3E9FF',p:'#FFC6D8',P:'#F29AB9',night:true},
 {v:4096,name:'Moonrise',    art:'moonrise', bg:'#2A2142',ink:'#FFF1BF',night:true}
];
const tierOf=v=>TIERS.find(t=>t.v===v)||TIERS[TIERS.length-1];
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,k)=>'#'+hex(a).map((x,i)=>Math.round(x+(hex(b)[i]-x)*k).toString(16).padStart(2,'0')).join('');
TIERS.forEach(t=>{t.soil=t.night?mix(t.bg,'#000000',.3):mix(t.bg,'#2B2238',.2);t.edge=t.night?mix(t.bg,'#000000',.35):mix(t.bg,'#2B2238',.28)});
const spriteCache={};
function sprite(t,locked){const k=t.v+(locked?'L':'');if(spriteCache[k])return spriteCache[k];const c=document.createElement('canvas');c.width=c.height=12;const x=c.getContext('2d');
 ART[t.art].forEach((row,r)=>[...row].forEach((ch,col)=>{if(ch==='.')return;x.fillStyle=locked?'#3D3448':ch==='p'?t.p:ch==='P'?t.P:ch==='d'?t.soil:INK[ch];x.fillRect(col,r,1,1)}));
 return spriteCache[k]=c.toDataURL()}
const petalColor=t=>t.p||(t.art==='daisy'?'#FFFFFF':'#86C78A');

const $=id=>document.getElementById(id),board=$('board'),layer=$('tiles'),petals=$('petals'),reduce=matchMedia('(prefers-reduced-motion: reduce)');
let state={grid:Array(16).fill(0),score:0,best:0,mute:false,won:false,winPending:false,undo:null,found:[2,4]},busy=false,ctx,toastTimer;
// Move planner: traversal order plus consuming pairs prevents double merges.
function plan(grid,dir){const out=Array(16).fill(0),motions=[],merged=[];let gain=0;
 for(let line=0;line<4;line++){const idx=Array.from({length:4},(_,n)=>dir==='left'?line*4+n:dir==='right'?line*4+3-n:dir==='up'?n*4+line:(3-n)*4+line);const occ=idx.filter(i=>grid[i]);let dest=0;
  for(let p=0;p<occ.length;p++){const from=occ[p],to=idx[dest++];let v=grid[from];motions.push({from,to});if(p+1<occ.length&&grid[occ[p+1]]===v){motions.push({from:occ[++p],to});v*=2;gain+=v;merged.push(to)}out[to]=v}}
 return{grid:out,gain,motions,merged,changed:out.some((v,i)=>v!==grid[i])}}
const isOver=g=>g.every(Boolean)&&g.every((v,i)=>(i%4===3||v!==g[i+1])&&(i>=12||v!==g[i+4]));
function spawn(g){const e=g.map((v,i)=>v?-1:i).filter(i=>i>=0);if(!e.length)return -1;const i=e[Math.floor(Math.random()*e.length)];g[i]=Math.random()<.9?2:4;return i}
const validGrid=g=>Array.isArray(g)&&g.length===16&&g.every(v=>Number.isSafeInteger(v)&&v>=0&&(v===0||(v>=2&&Number.isInteger(Math.log2(v)))));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){let ok=false;try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&validGrid(s.grid)&&Number.isFinite(s.score)&&s.score>=0){state={...state,...s,mute:!!s.mute,found:Array.isArray(s.found)?s.found.filter(Number.isSafeInteger):[2,4]};if(state.undo&&(!validGrid(state.undo.grid)||!Number.isFinite(state.undo.score)))state.undo=null;ok=true}}catch(e){}
 // Carry over best scores from the earlier versions of this game.
 try{const old=[+localStorage.getItem('2048_best')||0];const a=JSON.parse(localStorage.getItem('cozy2048ascii.v1')||'null');if(a&&Number.isFinite(a.best))old.push(a.best);state.best=Math.max(state.best||0,...old)}catch(e){}
 return ok}

let cell=90,step=100;
function measure(){const w=board.clientWidth,g=parseFloat(getComputedStyle(board).getPropertyValue('--gap'))||10;cell=(w-3*g)/4;step=cell+g;board.style.setProperty('--cell',cell+'px')}
const pos=(el,i)=>el.style.transform=`translate(${(i%4)*step}px,${Math.floor(i/4)*step}px)`;
function tile(v,i,kind){const t=tierOf(v),el=document.createElement('div');el.className='tile '+kind+(t.night?' night':'');el.dataset.index=i;el.setAttribute('role','img');el.setAttribute('aria-label',`${t.name}, ${v}, row ${Math.floor(i/4)+1} column ${i%4+1}`);
 el.style.cssText+=`--bg:${t.bg};--ink:${t.ink};--edge:${t.edge};--ns:${String(v).length>=4?.12:String(v).length===3?.135:.15}`;
 el.innerHTML=`<div class="face"><img alt="" src="${sprite(t)}"><span class="num">${v}</span></div>`;pos(el,i);return el}
function bestTier(){return Math.max(...state.found)}
function render(spawned=-1,merged=[]){measure();layer.replaceChildren();state.grid.forEach((v,i)=>{if(v)layer.append(tile(v,i,merged.includes(i)?'merge':i===spawned?'spawn':''))});
 $('score').textContent=state.score;$('best').textContent=state.best;$('undo').disabled=!state.undo||busy;$('new').disabled=busy;
 $('sound').textContent=state.mute?'Muted':'Sound';$('sound').setAttribute('aria-pressed',String(!state.mute));
 $('badge').src=sprite(tierOf(bestTier()));showOverlay()}
function showOverlay(){const win=state.winPending,over=isOver(state.grid),show=win||over,was=$('overlay').hidden;$('overlay').hidden=!show;board.inert=show;
 $('message').textContent=win?'You grew a moon tree.':'The garden is full.';$('ovImg').src=sprite(tierOf(win?2048:Math.max(...state.grid)));
 $('keep').hidden=!win;$('ovUndo').hidden=win||!state.undo;
 $('live').textContent=show?(win?'You reached 2048.':'Game over.'):`Score ${state.score}`;if(show&&was)(win?$('keep'):$('restart')).focus()}
function burst(i,v){if(reduce.matches)return;const t=tierOf(v),cx=(i%4)*step+cell/2,cy=Math.floor(i/4)*step+cell/2;for(let k=0;k<7;k++){const a=k/7*Math.PI*2+Math.random()*.6,d=cell*(.42+Math.random()*.25),p=document.createElement('i');p.className='petal';p.style.cssText=`left:${cx-2.5}px;top:${cy-2.5}px;--c:${k%3?petalColor(t):t.ink};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;petals.append(p);setTimeout(()=>p.remove(),560)}}
function flashPlus(n){const s=document.createElement('div');s.className='plus';s.textContent='+'+n;$('score').parentNode.append(s);setTimeout(()=>s.remove(),700)}
function discover(v){const t=tierOf(v),el=$('toast');el.innerHTML=`<div class="swatch" style="background:${t.bg}"><img alt="" src="${sprite(t)}"></div><div><small>NEW BLOOM · ${v}</small><b>${t.name}</b></div>`;el.hidden=false;el.style.animation='none';void el.offsetWidth;el.style.animation='';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2400);sound('chime')}

// Soft pentatonic plucks that climb with each tier.
const SCALE=[0,2,4,7,9];
function unlockAudio(){if(state.mute)return;try{ctx||=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume().catch(()=>{})}catch(e){}}
function tone(f,at,dur,vol=.035,type='triangle'){if(!ctx||state.mute)return;const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+at;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.02)}
const note=n=>261.63*Math.pow(2,(SCALE[n%5]+12*Math.floor(n/5))/12);
function sound(kind,tier=2){if(state.mute)return;const n=Math.log2(tier)-1;
 if(kind==='slide')tone(196,0,.05,.012,'sine');
 if(kind==='merge'){tone(note(n),0,.22);tone(note(n+2),.05,.26,.02,'sine')}
 if(kind==='chime')[0,2,4,5].forEach((k,i)=>tone(note(5+k),.12+i*.08,.5,.022,'sine'));
 if(kind==='win')[0,2,4,5,7,9].forEach((k,i)=>tone(note(5+k),i*.11,.8,.026,'sine'));
 if(kind==='over')tone(130,0,.4,.04,'sine')}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};

function move(dir){if(busy||state.winPending||isOver(state.grid))return false;const nx=plan(state.grid,dir);if(!nx.changed)return false;unlockAudio();
 state.undo={grid:state.grid.slice(),score:state.score};state.grid=nx.grid;state.score+=nx.gain;state.best=Math.max(state.best,state.score);
 const sp=spawn(state.grid),fresh=[...new Set(nx.merged.map(i=>nx.grid[i]))].filter(v=>!state.found.includes(v));state.found.push(...fresh);
 const newWin=!state.won&&state.grid.includes(2048);if(newWin){state.won=true;state.winPending=true}save();
 busy=true;$('undo').disabled=$('new').disabled=true;
 nx.motions.forEach(({from,to})=>{const el=layer.querySelector(`[data-index="${from}"]`);if(el)pos(el,to)});
 const top=Math.max(2,...nx.merged.map(i=>nx.grid[i]));sound(nx.gain?'merge':'slide',top);if(nx.gain){flashPlus(nx.gain);buzz(8)}
 const finish=()=>{busy=false;render(sp,nx.merged);nx.merged.forEach(i=>burst(i,nx.grid[i]));
  if(newWin)sound('win');else if(fresh.length)discover(Math.max(...fresh));else if(isOver(state.grid))sound('over')};
 if(reduce.matches)finish();else setTimeout(finish,115);return true}
function newGame(){if(busy)return;state={...state,grid:Array(16).fill(0),score:0,won:false,winPending:false,undo:null};spawn(state.grid);spawn(state.grid);save();render();board.focus({preventScroll:true})}
function undo(){if(busy||!state.undo)return;state.grid=state.undo.grid;state.score=state.undo.score;state.undo=null;state.winPending=false;save();render();board.focus({preventScroll:true})}

function openJournal(){const box=$('journal');box.replaceChildren();let n=0;
 TIERS.forEach(t=>{const got=state.found.includes(t.v)||state.found.some(v=>v>4096&&t.v===4096);if(got)n++;const e=document.createElement('div');e.className='entry'+(got?'':' locked');
  e.innerHTML=`<div class="pic" style="${got?'--bg:'+t.bg:''}"><img alt="" src="${sprite(t,!got)}"></div><div><b>${got?t.name:'Not yet grown'}</b><br><span>${t.v}</span></div>`;box.append(e)});
 $('jCount').textContent=`${n} OF ${TIERS.length} GROWN`;$('scrim').hidden=false;$('jClose').focus()}
function closeJournal(){$('scrim').hidden=true;$('journalBtn').focus()}

$('new').onclick=newGame;$('restart').onclick=newGame;$('undo').onclick=undo;$('ovUndo').onclick=undo;
$('keep').onclick=()=>{state.winPending=false;save();render();board.focus({preventScroll:true})};
$('sound').onclick=()=>{state.mute=!state.mute;unlockAudio();save();render()};
$('journalBtn').onclick=openJournal;$('jClose').onclick=closeJournal;$('scrim').addEventListener('click',e=>{if(e.target===e.currentTarget)closeJournal()});
const keys={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'up',ArrowDown:'down',s:'down'};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;if(!$('scrim').hidden){if(e.key==='Escape')closeJournal();return}
 const k=e.key.length===1?e.key.toLowerCase():e.key;if(keys[k]){e.preventDefault();move(keys[k])}else if(k==='u'){undo()}});
let ptr=null;board.addEventListener('pointerdown',e=>{if(!e.isPrimary)return;ptr={x:e.clientX,y:e.clientY,id:e.pointerId};try{board.setPointerCapture(e.pointerId)}catch(_){}});
board.addEventListener('pointerup',e=>{if(!ptr||ptr.id!==e.pointerId)return;const dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;ptr=null;if(Math.max(Math.abs(dx),Math.abs(dy))>=22)move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});
board.addEventListener('pointercancel',()=>ptr=null);
for(let i=0;i<16;i++){const c=document.createElement('div');c.className='cell';document.querySelector('.cells').append(c)}

// Fireflies: a few slow lilac pixels drifting behind everything.
(function(){const cv=$('fireflies'),x=cv.getContext('2d');let W,H,flies=[];const dpr=Math.min(2,devicePixelRatio||1);
 function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);flies=Array.from({length:Math.round(Math.min(26,W*H/26000))},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*6.28,v:.15+Math.random()*.25,z:Math.random()<.3?3:2}))}
 function draw(t){x.clearRect(0,0,W,H);flies.forEach(f=>{if(!reduce.matches){f.y-=f.v*.35;f.x+=Math.sin(t/2400+f.s)*.18;if(f.y<-4){f.y=H+4;f.x=Math.random()*W}}
  x.globalAlpha=.12+.22*(.5+.5*Math.sin(t/900+f.s*3));x.fillStyle=f.z===3?'#F2C94C':'#B9A9D9';x.fillRect(Math.round(f.x),Math.round(f.y),f.z,f.z)});if(!reduce.matches)requestAnimationFrame(draw)}
 size();addEventListener('resize',size);requestAnimationFrame(draw)})();

new ResizeObserver(()=>{if(!busy)render()}).observe(board);
if(load())render();else newGame();
</script>
</body>
</html>
